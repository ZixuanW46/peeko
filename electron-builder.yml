appId: com.will.peeko
productName: Peeko
directories:
  buildResources: build
files:
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/uiohook-napi/**
afterPack: scripts/prune-electron-locales.mjs
afterSign: scripts/adhoc-sign.mjs
mac:
  hardenedRuntime: true
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  # Developer ID 证书存在时 electron-builder 正式签名；公证由 scripts/build-mac-signed.mjs
  # 手动控制，避免 @electron/notarize 固定 S3 acceleration。无证书本地包由 afterSign 补 ad-hoc。
  extendInfo:
    LSUIElement: true # 菜单栏附件应用：无 Dock 图标
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: ZixuanW46
  repo: peeko
  releaseType: release
